    <!-- Safe window.fetch setup to prevent third-party extension injection issues -->
    <script>
      (function() {
        var _fetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(fn) { _fetch = fn; },
            configurable: true
          });
        } catch(e) {}
        window.addEventListener('error', function(e) {
          if (e.filename && (e.filename.includes('chrome-extension://') || e.filename.includes('moz-extension://'))) {
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && e.reason.message && e.reason.message.includes('extension')) {
            e.preventDefault();
          }
        });
      })();
    </script>
